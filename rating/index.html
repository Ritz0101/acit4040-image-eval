<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room rating</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1d1d1b; --muted:#6b6a66; --card:#fff; --line:#dddbd5; --accent:#2f5d50; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; flex:1; max-width:320px; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  h1 { font-size:20px; margin:8px 0 16px; font-weight:600; }
  .imgs { display:grid; gap:12px; grid-template-columns:1fr; }
  .imgs.two { grid-template-columns:1fr 1fr; }
  .imgs.product { grid-template-columns:1fr 2fr; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
  figure img { width:100%; max-height:62vh; object-fit:contain; display:block; }
  figcaption { color:var(--muted); font-size:14px; padding-top:6px; text-align:center; }
  .q { margin:16px 0 6px; font-weight:600; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; padding:10px 16px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.next { margin-top:20px; background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .muted { color:var(--muted); }
  @media (max-width:700px) { .imgs.two, .imgs.product { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const params = new URLSearchParams(location.search);
const rater = params.get("rater");
const app = document.getElementById("app");
const store = "rating_" + rater;
let data, answers = {}, i = 0, shownAt = 0, cur = {};

function load() { try { answers = JSON.parse(localStorage.getItem(store) || "{}"); } catch { answers = {}; } }
function save() { try { localStorage.setItem(store, JSON.stringify(answers)); } catch {} }

const QUALITY = ["1 Bad", "2 Poor", "3 Fair", "4 Good", "5 Excellent"];

function opts(name, values) {
  return `<div class="opts">${values.map(v =>
    `<button data-k="${name}" data-v="${v}">${v}</button>`).join("")}</div>`;
}

function render() {
  if (i >= data.trials.length) return done();
  const t = data.trials[i];
  cur = {};
  shownAt = performance.now();
  let html = `<header><span class="muted">${i + 1} / ${data.trials.length}</span>
    <div class="bar"><div style="width:${100 * i / data.trials.length}%"></div></div></header>`;
  if (t.type === "ab") {
    html += `<h1>Which room fits your own taste better?</h1>
      <div class="imgs two">${t.images.map((s, j) => `<figure><img src="${s}"><figcaption>${"AB"[j]}</figcaption></figure>`).join("")}</div>
      <p class="q">Pick one, even if it is close.</p>${opts("choice", ["A", "B"])}`;
  } else if (t.type === "rate") {
    html += `<h1>Look at this room</h1>
      <div class="imgs"><figure><img src="${t.images[0]}"></figure></div>
      <p class="q">Overall image quality</p>${opts("quality", QUALITY)}
      <p class="q">Is this a real photo or AI-generated?</p>${opts("real", ["Real photo", "AI-generated"])}`;
  } else if (t.type === "product") {
    html += `<h1>Is this exact ${t.label} in the room?</h1>
      <div class="imgs product"><figure><img src="${t.images[0]}"><figcaption>Product</figcaption></figure>
      <figure><img src="${t.images[1]}"><figcaption>Room</figcaption></figure></div>
      <p class="q">Same product, as you would get it delivered?</p>
      ${opts("product", ["Yes, same product", "Similar, but not the same", "No", "Can't find it"])}`;
  }
  const need = { ab: ["choice"], rate: ["quality", "real"], product: ["product"] }[t.type];
  html += `<div><button class="next" disabled>Next</button></div>`;
  app.innerHTML = html;
  app.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => {
    cur[b.dataset.k] = b.dataset.v;
    app.querySelectorAll(`button[data-k="${b.dataset.k}"]`).forEach(x => x.classList.toggle("on", x === b));
    app.querySelector(".next").disabled = !need.every(k => k in cur);
  });
  app.querySelector(".next").onclick = () => {
    answers[t.id] = { ...cur, ms: Math.round(performance.now() - shownAt) };
    save(); i++; render(); scrollTo(0, 0);
  };
}

function csv() {
  const rows = [["rater", "trial_id", "type", "choice", "quality", "real", "product", "ms"]];
  for (const t of data.trials) {
    const a = answers[t.id]; if (!a) continue;
    rows.push([rater, t.id, t.type, a.choice || "", a.quality ? a.quality[0] : "", a.real || "", a.product || "", a.ms]);
  }
  return rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
}

function done() {
  app.innerHTML = `<h1>Done, thank you</h1><p>Download your answers and send the file to the group.</p>
    <button class="next" id="dl">Download answers_${rater}.csv</button>`;
  document.getElementById("dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv()], { type: "text/csv" }));
    a.download = `answers_${rater}.csv`; a.click();
  };
}

if (!rater) {
  app.innerHTML = `<h1>Missing rater</h1><p>Open this page as <code>index.html?rater=YOUR_ID</code>.</p>`;
} else {
  fetch(`trials_${rater}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    data = d; load();
    i = data.trials.findIndex(t => !answers[t.id]);
    if (i < 0) i = data.trials.length;
    render();
  }).catch(e => { app.innerHTML = `<h1>Could not load trials for "${rater}"</h1><p class="muted">${e}</p>`; });
}
</script>
</body>
</html>
